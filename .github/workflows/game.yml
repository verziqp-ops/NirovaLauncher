# Nirova game builds are produced from this repository's source. No Horizon release
# archives or prebuilt upstream binaries are downloaded or used as package inputs.
name: game

on:
  push:
    # Build our own Rust game from working-branch source so previews can be tested
    # before a stable v* release exists. These branch builds are artifacts only.
    branches: ['nivrora/**']
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/game.yml'
      - 'crates/**'
      - 'mods/horizon/src/test/java/**'
      - 'research-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nirova-game-${{ github.ref }}
  cancel-in-progress: false

jobs:
  brand-assets:
    name: Render NIROVA game icons
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate icons from the NIROVA master artwork
        run: cargo run --locked -p xtask -- icons
      - uses: actions/upload-artifact@v4
        with:
          name: nirova-game-brand-assets
          path: |
            crates/horizon-theme/icons/nirova-64.png

  pick:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.meta.outputs.date }}
      short: ${{ steps.meta.outputs.short }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      nightly: ${{ steps.meta.outputs.nightly }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          short="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" == refs/heads/nivrora/* ]]; then
            tag=nightly
            version="nightly-$date-$short"
            nightly="$date $short"
            channel=preview
          elif [[ "$GITHUB_REF_NAME" == v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
            nightly=
            channel=stable
          else
            echo "::error::Unsupported release trigger"
            exit 1
          fi
          {
            echo "date=$date"
            echo "short=$short"
            echo "tag=$tag"
            echo "version=$version"
            echo "nightly=$nightly"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.name }}
    needs: [pick, brand-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: ''
            asset: nirova-game-linux-x86_64.tar.gz
            binary: horizon-client
            prepare: horizon-prepare
            rustflags: ''
          - name: windows
            os: windows-latest
            target: ''
            asset: nirova-game-windows-x64.zip
            binary: horizon-client.exe
            prepare: horizon-prepare.exe
            rustflags: -C target-feature=+crt-static
          - name: macos
            os: macos-15
            target: ''
            asset: nirova-game-macos-arm64.zip
            binary: horizon-client
            prepare: horizon-prepare
            rustflags: ''
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            asset: nirova-game-macos-x64.zip
            binary: horizon-client
            prepare: horizon-prepare
            rustflags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      NIROVA_VERSION: ${{ needs.pick.outputs.version }}
      NIROVA_NIGHTLY: ${{ needs.pick.outputs.nightly }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nirova-game-brand-assets
          path: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nirova-game-${{ matrix.name }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Build Nirova game and resource preparer from this checkout
        run: |
          set -euo pipefail
          build=(cargo build --release --locked)
          [[ -z "${{ matrix.target }}" ]] || build+=(--target "${{ matrix.target }}")
          "${build[@]}" -p horizon-client --bin horizon-client
          "${build[@]}" -p horizon-prepare --bin horizon-prepare
          out=target/release
          [[ -z "${{ matrix.target }}" ]] || out="target/${{ matrix.target }}/release"
          echo "BUILD_OUT=$out" >> "$GITHUB_ENV"
      - name: Package the Nirova game and its own resource-preparation sources
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/dist/nirova-game-${{ matrix.name }}"
          mkdir -p "$bundle/crates" "$bundle/mods/horizon/src/test"
          cp "$BUILD_OUT/${{ matrix.binary }}" "$bundle/"
          cp "$BUILD_OUT/${{ matrix.prepare }}" "$bundle/"
          cp research-lock.json "$bundle/"
          cp -R crates/horizon-prepare "$bundle/crates/"
          cp -R mods/horizon/src/test/java "$bundle/mods/horizon/src/test/"
          test -f "$bundle/crates/horizon-prepare/src/lib.rs"
          test -f "$bundle/mods/horizon/src/test/java/dev/horizonlab/parity/PrepareWorker.java"
          test -f "$bundle/research-lock.json"
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --force --sign - "$bundle/${{ matrix.binary }}"
            codesign --force --sign - "$bundle/${{ matrix.prepare }}"
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          case "${{ matrix.name }}" in
            linux)
              tar -czf "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" -C "$GITHUB_WORKSPACE/dist" "nirova-game-${{ matrix.name }}"
              ;;
            *)
              if [[ "$RUNNER_OS" == Windows ]]; then
                (cd "$GITHUB_WORKSPACE/dist" && 7z a -tzip "${{ matrix.asset }}" "nirova-game-${{ matrix.name }}") > /dev/null
              else
                ditto -c -k --norsrc --noextattr --noqtn --keepParent "$GITHUB_WORKSPACE/dist/nirova-game-${{ matrix.name }}" "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}"
              fi
              ;;
          esac
          tar -tzf "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" >/dev/null 2>&1 || [[ "${{ matrix.name }}" != linux ]]
          ls -lh "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  server:
    name: build server ${{ matrix.name }}
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: ''
            asset: nirova-server-linux-x86_64.tar.gz
          - name: macos-arm64
            os: macos-15
            target: ''
            asset: nirova-server-macos-arm64.zip
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            asset: nirova-server-macos-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      NIROVA_VERSION: ${{ needs.pick.outputs.version }}
      NIROVA_NIGHTLY: ${{ needs.pick.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nirova-server-${{ matrix.name }}
      - name: Linux audio and device headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Build the Nirova server, game and preparer from source
        shell: bash
        run: |
          set -euo pipefail
          build=(cargo build --release --locked)
          [[ -z "${{ matrix.target }}" ]] || build+=(--target "${{ matrix.target }}")
          "${build[@]}" -p horizon-client --bin horizon-client
          "${build[@]}" -p horizon-prepare --bin horizon-prepare
          "${build[@]}" -p horizon-server --bin horizon-server
          out=target/release
          [[ -z "${{ matrix.target }}" ]] || out="target/${{ matrix.target }}/release"
          echo "BUILD_OUT=$out" >> "$GITHUB_ENV"
      - name: Package the server with Nirova's own resource preparer
        shell: bash
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/dist/nirova-server-${{ matrix.name }}"
          mkdir -p "$bundle/crates" "$bundle/mods/horizon/src/test"
          cp "$BUILD_OUT/horizon-server" "$bundle/"
          cp "$BUILD_OUT/horizon-client" "$bundle/"
          cp "$BUILD_OUT/horizon-prepare" "$bundle/"
          cp research-lock.json "$bundle/"
          cp -R crates/horizon-prepare "$bundle/crates/"
          cp -R mods/horizon/src/test/java "$bundle/mods/horizon/src/test/"
          test -f "$bundle/horizon-server"
          test -f "$bundle/horizon-client"
          test -f "$bundle/crates/horizon-prepare/src/lib.rs"
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --force --sign - "$bundle/horizon-server"
            codesign --force --sign - "$bundle/horizon-client"
            codesign --force --sign - "$bundle/horizon-prepare"
            ditto -c -k --norsrc --noextattr --noqtn --keepParent "$bundle" "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}"
          else
            tar -czf "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" -C "$GITHUB_WORKSPACE/dist" "nirova-server-${{ matrix.name }}"
            tar -tzf "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" | grep "nirova-server-${{ matrix.name }}/horizon-server" > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [pick, build, server]
    # Only explicit manual runs or version tags may publish a release.
    # Ordinary branch pushes create downloadable Action artifacts, never releases.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true
      - name: Sign checksums for Nirova's own release channel
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "::error::The RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          bash tools/ci/sign_release.sh "${{ needs.pick.outputs.tag }}" dist/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the release signature as the launcher does
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag "${{ needs.pick.outputs.tag }}" --publishing dist
      - name: Publish Preview channel
        if: needs.pick.outputs.channel == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.pick.outputs.date }}
          SHORT: ${{ needs.pick.outputs.short }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Nirova Preview build from this repository's source (commit $SHORT).
          The game, resource preparer and Linux server are built and packaged here.
          No Horizon release archives are used as build inputs.
          EOF
          python3 tools/ci/nightly.py rotate
          gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly $DATE · $SHORT" --notes-file notes.md \
            "dist/nirova-game-linux-x86_64.tar.gz#Nirova game: Linux x86_64" \
            "dist/nirova-game-windows-x64.zip#Nirova game: Windows x64" \
            "dist/nirova-game-macos-arm64.zip#Nirova game: macOS Apple Silicon" \
            "dist/nirova-game-macos-x64.zip#Nirova game: macOS Intel" \
            "dist/nirova-server-linux-x86_64.tar.gz#Nirova dedicated server: Linux x86_64" \
            "dist/nirova-server-macos-arm64.zip#Nirova dedicated server: macOS Apple Silicon" \
            "dist/nirova-server-macos-x64.zip#Nirova dedicated server: macOS Intel" \
            dist/SHA256SUMS dist/SHA256SUMS.sig
          python3 tools/ci/nightly.py prune --days 7
      - name: Publish Stable channel
        if: needs.pick.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pick.outputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Nirova Stable release $TAG, built entirely from this repository's source.
          The game, resource preparer and Linux server are built and packaged here.
          EOF
          gh release create "$TAG" --latest=false --target "$GITHUB_SHA" \
            --title "Nirova $TAG" --notes-file notes.md \
            "dist/nirova-game-linux-x86_64.tar.gz#Nirova game: Linux x86_64" \
            "dist/nirova-game-windows-x64.zip#Nirova game: Windows x64" \
            "dist/nirova-game-macos-arm64.zip#Nirova game: macOS Apple Silicon" \
            "dist/nirova-game-macos-x64.zip#Nirova game: macOS Intel" \
            "dist/nirova-server-linux-x86_64.tar.gz#Nirova dedicated server: Linux x86_64" \
            "dist/nirova-server-macos-arm64.zip#Nirova dedicated server: macOS Apple Silicon" \
            "dist/nirova-server-macos-x64.zip#Nirova dedicated server: macOS Intel" \
            dist/SHA256SUMS dist/SHA256SUMS.sig
