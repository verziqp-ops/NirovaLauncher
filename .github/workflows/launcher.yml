# NIROVA Launcher: tests on every push and pull request; a tag `launcher@1.2.3` builds the
# launcher for Windows (with its installer), Linux and macOS, signs the checksums and publishes them
# as a GitHub release, which launchers already installed update themselves from.
name: launcher

on:
  push:
    branches: [main, 'nivrora/**']
    tags: ['launcher@*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"
  NIROVA_RELEASE_TAG: ${{ github.ref_name == 'nivrora/release-1.4.0' && 'launcher@1.4.0' || github.ref_name }}

jobs:
  brand-assets:
    name: Render NIROVA platform icons
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate icons from the NIROVA master artwork
        run: cargo run --locked -p xtask -- icons
      - uses: actions/upload-artifact@v4
        with:
          name: nirova-brand-assets
          path: |
            packaging/icons/
            crates/horizon-theme/icons/nirova-64.png
            docs/media/brand/icon-1024.png
            docs/media/brand/icon-macos-1024.png
            docs/media/brand/social/github-avatar-500.png
            docs/media/brand/web/

  # The tests run once, on Linux: some of upstream's tests depend on the machine (the trash on
  # Windows, macOS on a hosted runner), and a build never waits for them.
  test:
    needs: [brand-assets]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nirova-brand-assets
          path: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Verify the committed launcher lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Libraries GPUI links to
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - run: cargo test --release --locked

  build:
    needs: [brand-assets]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            binary: nirova-launcher.exe
            asset: nirova-launcher-windows-x64.zip
            rustflags: -C target-feature=+crt-static
          - name: linux
            os: ubuntu-22.04
            binary: nirova-launcher
            asset: nirova-launcher-linux-x86_64.tar.gz
          - name: macos
            os: macos-15
            binary: nirova-launcher
            asset: nirova-launcher-macos-arm64.zip
          # Intel Macs: the same runner, another target.
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            binary: nirova-launcher
            asset: nirova-launcher-macos-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nirova-brand-assets
          path: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          key: ${{ matrix.name }}
      - name: Verify the committed launcher lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Metal shaders at run time without the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "LAUNCHER_FEATURES=gpui/runtime_shaders" >> "$GITHUB_ENV"
          fi
      # A tag launcher@1.2.3 is the launcher's version 1.2.3; other builds say Cargo.toml's.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/launcher@') || github.ref_name == 'nivrora/release-1.4.0'
        run: |
          echo "NIROVA_LAUNCHER_VERSION=${NIROVA_RELEASE_TAG#launcher@}" >> "$GITHUB_ENV"
          echo "NIROVA_LAUNCHER_TAG=$NIROVA_RELEASE_TAG" >> "$GITHUB_ENV"
      - run: cargo build --release --locked ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Package
        run: |
          mkdir -p ../dist
          out=target/release; [[ -n "${{ matrix.target }}" ]] && out="target/${{ matrix.target }}/release"
          case "${{ matrix.name }}" in
            windows) 7z a -tzip ../dist/${{ matrix.asset }} "./$out/${{ matrix.binary }}" > /dev/null ;;
            linux) tar -czf ../dist/${{ matrix.asset }} -C "$out" ${{ matrix.binary }} ;;
            macos*) echo "macOS app bundle is packaged in the next step" ;;
          esac
      - name: Build the NIROVA macOS app and disk image
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          source "$RUNNER_TEMP/dmgbuild-venv/bin/activate"
          python -m pip install --disable-pip-version-check dmgbuild==1.6.5
          out=target/release
          [[ -n "${{ matrix.target }}" ]] && out="target/${{ matrix.target }}/release"
          version="${NIROVA_LAUNCHER_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)}"
          arch=arm64
          [[ "${{ matrix.name }}" == "macos-x64" ]] && arch=x64
          ../packaging/macos/package.sh "$PWD/$out/${{ matrix.binary }}" "$version" "$GITHUB_WORKSPACE/dist" "$arch"
      - name: Upload the NIROVA macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: nirova-launcher-macos-${{ matrix.name == 'macos-x64' && 'x64' || 'arm64' }}.dmg
          path: dist/nirova-launcher-macos-${{ matrix.name == 'macos-x64' && 'x64' || 'arm64' }}.dmg
      # The installer most people download (packaging/windows/setup.iss); the zip stays what
      # launchers update themselves from.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          if ($env:NIROVA_LAUNCHER_VERSION) {
            $version = $env:NIROVA_LAUNCHER_VERSION
          } else {
            $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
            if (-not $match) { throw "Could not read launcher version from Cargo.toml" }
            $version = $match.Matches[0].Groups[1].Value
          }
          & $iscc /Q "/DAppVersion=$version" "/DSource=$PWD\target\release\nirova-launcher.exe" "/O$PWD\..\dist" ..\packaging\windows\setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem ..\dist
      - name: Scan Windows outputs with Microsoft Defender when available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scan = Join-Path $env:RUNNER_TEMP 'nirova-defender-scan'
          New-Item -ItemType Directory -Force $scan | Out-Null
          Copy-Item target/release/nirova-launcher.exe $scan
          Copy-Item ../dist/NIROVA-Setup.exe $scan
          & ../tools/windows/scan-defender.ps1 -Folder $scan -Report ../dist/defender-scan.json
      - name: Upload Windows security diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nirova-defender-report
          path: dist/defender-scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: NIROVA-Setup.exe
          path: dist/NIROVA-Setup.exe

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/launcher@') || github.ref_name == 'nivrora/release-1.4.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: nirova-launcher-*
      - uses: actions/download-artifact@v4
        with:
          name: NIROVA-Setup.exe
          path: dist
      - name: Require every platform before publication
        run: |
          for file in NIROVA-Setup.exe nirova-launcher-windows-x64.zip nirova-launcher-linux-x86_64.tar.gz nirova-launcher-macos-arm64.zip nirova-launcher-macos-arm64.dmg nirova-launcher-macos-x64.zip nirova-launcher-macos-x64.dmg; do
            test -s "dist/$file" || { echo "::error::Missing $file"; exit 1; }
          done
      - name: Sign the checksums (SHA256SUMS, SHA256SUMS.sig)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "::error::The RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          bash tools/ci/sign_release.sh "$NIROVA_RELEASE_TAG" dist/*
      - uses: dtolnay/rust-toolchain@stable
      - name: The signature, checked as launchers check it
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag "$NIROVA_RELEASE_TAG" dist
      - name: Select release notes for this version
        run: |
          version="${NIROVA_RELEASE_TAG#launcher@}"
          notes="docs/releases/launcher-$version.md"
          test -f "$notes"
          echo "NIROVA_RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: NIROVA Launcher ${{ env.NIROVA_RELEASE_TAG }}
          tag_name: ${{ env.NIROVA_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ env.NIROVA_RELEASE_NOTES }}
          files: |
            dist/*
            install.ps1
            install.sh
          make_latest: true
          generate_release_notes: true

      - name: Remove the superseded empty release after successful publication
        if: env.NIROVA_RELEASE_TAG == 'launcher@1.4.0' || env.NIROVA_RELEASE_TAG == 'launcher@1.4.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$NIROVA_RELEASE_TAG" --json assets --jq '.assets | length' | awk '$1 >= 9 { ok=1 } END { exit !ok }'
          gh api --method DELETE repos/${{ github.repository }}/releases/435895421
